<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YouTube to MP3</title>
<style>
:root {
  --bg: #f3f5f7; --surface: #fff; --fg: #141920; --muted: #5a6473; --line: #dbe0e6;
  --accent: #c4302b; --accent-fg: #fff; --ok: #0b6e5f; --err: #a4460f; --radius: 10px;
  font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0e1115; --surface: #161a20; --fg: #e7eaee; --muted: #98a2ae; --line: #29303a;
          --accent: #ff5a52; --accent-fg: #1a0605; --ok: #3cc4a8; --err: #f0965a; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
       display: grid; place-items: center; padding: 16px; }
main { width: 100%; max-width: 560px; background: var(--surface); border: 1px solid var(--line);
       border-radius: var(--radius); padding: 28px; }
h1 { margin: 0 0 4px; font-size: 1.6rem; }
p.sub { margin: 0 0 22px; color: var(--muted); }
label { display: block; font-weight: 600; margin-bottom: 6px; font-size: .9rem; }
input, select { width: 100%; font: inherit; padding: 11px 12px; border: 1px solid var(--line);
                border-radius: 8px; background: var(--bg); color: var(--fg); }
.row { display: flex; gap: 10px; margin-top: 14px; align-items: end; }
.row > div { flex: 1; }
button { font: inherit; font-weight: 600; padding: 11px 20px; border: 0; border-radius: 8px;
         background: var(--accent); color: var(--accent-fg); cursor: pointer; white-space: nowrap; }
button:disabled { opacity: .6; cursor: progress; }
#status { margin-top: 18px; min-height: 1.4em; font-size: .95rem; }
#status.ok { color: var(--ok); } #status.err { color: var(--err); }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor;
        border-right-color: transparent; border-radius: 50%; animation: s .7s linear infinite;
        vertical-align: -2px; margin-right: 6px; }
@keyframes s { to { transform: rotate(360deg); } }
small { display: block; margin-top: 20px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>YouTube → MP3</h1>
  <p class="sub">Paste a link, get an MP3 with title and cover art.</p>
  <form id="f">
    <label for="url">YouTube link</label>
    <input id="url" type="url" required placeholder="https://www.youtube.com/watch?v=…" autofocus>
    <div class="row">
      <div>
        <label for="br">Quality</label>
        <select id="br">
          <option value="128">128 kbps</option>
          <option value="192" selected>192 kbps</option>
          <option value="256">256 kbps</option>
          <option value="320">320 kbps</option>
        </select>
      </div>
      <button id="go" type="submit">Download MP3</button>
    </div>
  </form>
  <div id="status" role="status"></div>
  <small>Only download audio you own or have permission to use.</small>
</main>
<script>
const f = document.getElementById("f"), go = document.getElementById("go"), st = document.getElementById("status");
function say(html, cls = "") { st.className = cls; st.innerHTML = html; }

f.addEventListener("submit", async (e) => {
  e.preventDefault();
  go.disabled = true;
  say('<span class="spin"></span>Downloading and converting… this can take a minute.');
  try {
    const res = await fetch("/api/convert", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: document.getElementById("url").value, bitrate: document.getElementById("br").value }),
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || `Failed (${res.status})`);
    const cd = res.headers.get("Content-Disposition") || "";
    const m = cd.match(/filename\*=UTF-8''([^;]+)/);
    const name = m ? decodeURIComponent(m[1]) : "audio.mp3";
    const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(await res.blob()), download: name });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    say("Saved: " + name.replace(/[<&]/g, c => c === "<" ? "&lt;" : "&amp;"), "ok");
  } catch (err) {
    say(String(err.message).replace(/[<&]/g, c => c === "<" ? "&lt;" : "&amp;"), "err");
  } finally {
    go.disabled = false;
  }
});
</script>
</body>
</html>
